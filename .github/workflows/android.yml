name: temp CI

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: '新的应用包名（例如 com.example.myapp）'
        required: true
        default: 'com.example.ci.build'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIKARINAGI_CLIENT_ID: ${{ vars.HIKARINAGI_CLIENT_ID }}
      NEW_APP_ID: ${{ github.event.inputs.app_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      # ---------- 核心：替换 applicationId ----------
      - name: Replace applicationId in build.gradle
        run: |
          # 如果 app/build.gradle 不存在，则尝试根目录的 build.gradle
          if [ -f "app/build.gradle" ]; then
            GRADLE_FILE="app/build.gradle"
          elif [ -f "build.gradle" ]; then
            GRADLE_FILE="build.gradle"
          else
            echo "❌ 未找到 build.gradle 文件"
            exit 1
          fi
          echo "📝 正在修改文件: $GRADLE_FILE"
          # 替换 applicationId "..." 为 applicationId "新包名"
          sed -i "s/applicationId \".*\"/applicationId \"$NEW_APP_ID\"/" "$GRADLE_FILE"
          echo "✅ 包名已改为: $NEW_APP_ID"
          # 可选：打印修改后的内容（调试用）
          grep "applicationId" "$GRADLE_FILE" || echo "⚠️ 未找到 applicationId，请检查文件格式"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
